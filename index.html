<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunda - Bayar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0f1117;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8eaf0;
    }
    .wrap { text-align: center; padding: 2rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2d3e;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #6b7094; margin: 0 0 16px; }
    a {
      font-size: 13px; color: #4f8ef7;
      text-decoration: none; border-bottom: 1px solid rgba(79,142,247,0.3);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Membuka Tunda Bayar...</p>
    <a href="https://script.google.com/macros/s/AKfycbx7t7Yez3kpW3zUJmtlcVXTudpOm63vr2FoGHB9gj_FE2-9HI67rlzU3vhaPU9hqCOLoA/exec">
      Klik di sini jika tidak otomatis
    </a>
  </div>
  <script>
    // Redirect full-page, bukan iframe — banner tidak akan muncul
    window.location.replace("https://script.google.com/macros/s/AKfycbx7t7Yez3kpW3zUJmtlcVXTudpOm63vr2FoGHB9gj_FE2-9HI67rlzU3vhaPU9hqCOLoA/exec");
  </script>
</body>
</html>
