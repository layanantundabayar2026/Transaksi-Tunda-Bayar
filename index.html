<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transaksi Tunda Bayar</title>
  
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2845/2845660.png" />
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda pada browser */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser (mengantisipasi URL bar) */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbx7t7Yez3kpW3zUJmtlcVXTudpOm63vr2FoGHB9gj_FE2-9HI67rlzU3vhaPU9hqCOLoA/exec"
      scrolling="yes"
      allowfullscreen="true"
      loading="lazy"
      /* OPTIMASI: Membuka izin fitur krusial (submit form, script berjalan, popup dialog transaksi) */
      sandbox="allow-top-navigation allow-scripts allow-forms allow-same-origin allow-popups allow-modals"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

</body>
</html>
